<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📈 Indian Stock Signal Generator (NSE)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --buy: #22c55e;
      --sell: #ef4444;
      --hold: #f59e0b;
      --line: #374151;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020817, #111827 40%, #0f172a);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(28px, 3vw, 40px);
      text-align: center;
      color: #f8fafc;
    }

    .search-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      width: min(100%, 540px);
      justify-content: center;
      flex-wrap: wrap;
    }

    input {
      flex: 1 1 260px;
      max-width: 420px;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(17, 24, 39, 0.9);
      color: var(--text);
      outline: none;
    }

    button {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }

    #suggestions {
      width: min(100%, 420px);
      max-height: 180px;
      overflow-y: auto;
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid var(--line);
      border-radius: 10px;
      display: block;
      margin: 0 auto;
      color: var(--text);
    }

    #suggestions div {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .suggestion-item {
      transition: background 0.15s ease;
    }

    .suggestion-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }

    .suggestion-symbol {
      color: #7dd3fc;
      font-weight: 700;
      min-width: 96px;
      text-transform: uppercase;
    }

    .suggestion-name {
      color: var(--text);
      font-size: 13px;
      flex: 1;
      text-align: left;
      opacity: 0.95;
    }

    .empty-item {
      color: var(--muted);
      padding: 10px 12px;
      font-size: 13px;
    }

    #suggestions div:last-child { border-bottom: none; }
    #suggestions div:hover {
      background: rgba(59,130,246,0.16);
    }

    .chart-card, .signal-card {
      background: rgba(31, 41, 55, 0.92);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-top: 18px;
    }

    canvas {
      display: block;
      width: 100% !important;
      max-height: 440px;
      border-radius: 12px;
    }

    #signalBox {
      margin-top: 0;
      font-size: 18px;
      font-weight: bold;
      color: var(--text);
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #signalBox.buy { color: var(--buy); }
    #signalBox.sell { color: var(--sell); }
    #signalBox.hold { color: var(--hold); }
    #signalBox.loading { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 Indian Stock Signal Generator (NSE)</h1>

    <div class="search-wrap">
      <div class="search-row">
        <input type="text" id="stockInput" placeholder="Enter NSE symbol (e.g. WIPRO)">
        <button onclick="loadStock()">Load Stock</button>
      </div>
      <div id="suggestions"></div>
    </div>

    <div class="chart-card">
      <canvas id="stockChart" width="800" height="400"></canvas>
    </div>

    <div class="signal-card">
      <div id="signalBox" class="signalBox hold">Enter a stock above to see signals</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
