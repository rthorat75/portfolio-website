<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📈 Indian Stock Signal Generator (NSE)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --buy: #22c55e;
      --sell: #ef4444;
      --hold: #f59e0b;
      --line: #374151;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020817, #111827 40%, #0f172a);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 16px;
    }

    .page-shell {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .container {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }

    .sidebar {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      position: sticky;
      top: 20px;
    }

    .sidebar h3 {
      margin: 0 0 12px;
      font-size: 18px;
      color: #f8fafc;
    }

    .sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-section {
      margin-bottom: 14px;
    }

    .sidebar-title {
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .sidebar-item {
      border: 1px solid var(--line);
      background: rgba(17, 24, 39, 0.9);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .sidebar-item:hover {
      transform: translateY(-1px);
      border-color: rgba(56, 189, 248, 0.7);
    }

    .sidebar-item.buy { border-left: 4px solid var(--buy); }
    .sidebar-item.sell { border-left: 4px solid var(--sell); }

    .sidebar-topline {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .sidebar-symbol {
      color: #7dd3fc;
      text-transform: uppercase;
    }

    .sidebar-tag {
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 3px 6px;
      border-radius: 999px;
      font-weight: 700;
    }

    .sidebar-tag.buy {
      background: rgba(34, 197, 94, 0.12);
      color: var(--buy);
    }

    .sidebar-tag.sell {
      background: rgba(239, 68, 68, 0.12);
      color: var(--sell);
    }

    .sidebar-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(28px, 3vw, 40px);
      text-align: center;
      color: #f8fafc;
    }

    .search-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      width: min(100%, 540px);
      justify-content: center;
      flex-wrap: wrap;
    }

    input {
      flex: 1 1 260px;
      max-width: 420px;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(17, 24, 39, 0.9);
      color: var(--text);
      outline: none;
    }

    button {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }

    #suggestions {
      width: min(100%, 420px);
      max-height: 180px;
      overflow-y: auto;
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid var(--line);
      border-radius: 10px;
      display: block;
      margin: 0 auto;
      color: var(--text);
    }

    #suggestions div {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .suggestion-item {
      transition: background 0.15s ease;
    }

    .suggestion-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }

    .suggestion-symbol {
      color: #7dd3fc;
      font-weight: 700;
      min-width: 96px;
      text-transform: uppercase;
    }

    .suggestion-name {
      color: var(--text);
      font-size: 13px;
      flex: 1;
      text-align: left;
      opacity: 0.95;
    }

    .empty-item {
      color: var(--muted);
      padding: 10px 12px;
      font-size: 13px;
    }

    #suggestions div:last-child { border-bottom: none; }
    #suggestions div:hover {
      background: rgba(59,130,246,0.16);
    }

    .chart-card, .signal-card {
      background: rgba(31, 41, 55, 0.92);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-top: 18px;
    }

    canvas {
      display: block;
      width: 100% !important;
      max-height: 440px;
      border-radius: 12px;
    }

    #signalBox {
      margin-top: 0;
      font-size: 18px;
      font-weight: bold;
      color: var(--text);
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #signalBox.buy { color: var(--buy); }
    #signalBox.sell { color: var(--sell); }
    #signalBox.hold { color: var(--hold); }
    #signalBox.loading { color: var(--accent); }
  </style>
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <h3>Strong setups</h3>
      <div id="signalSidebar" class="sidebar-list"></div>
    </aside>

    <div class="container">
      <h1>📈 Indian Stock Signal Generator (NSE)</h1>

      <div class="search-wrap">
        <div class="search-row">
          <input type="text" id="stockInput" placeholder="Enter NSE symbol (e.g. WIPRO)">
          <button onclick="loadStock()">Load Stock</button>
        </div>
        <div id="suggestions"></div>
      </div>

      <div class="chart-card">
        <canvas id="stockChart" width="800" height="400"></canvas>
      </div>

      <div class="signal-card">
        <div id="signalBox" class="signalBox hold">Enter a stock above to see signals</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
